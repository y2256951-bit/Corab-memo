<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif;padding:20px;font-size:20px">
<p id="r">Test en cours…</p>
<script>
fetch('https://api.alquran.cloud/v1/quran/quran-uthmani')
  .then(function (x) { return x.json(); })
  .then(function (j) { document.getElementById('r').textContent = j.data.surahs.length + ' sourates trouvées'; })
  .catch(function (e) { document.getElementById('r').textContent = 'Erreur : ' + e; });
</script>
</body></html>
